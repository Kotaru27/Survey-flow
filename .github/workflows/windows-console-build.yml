name: Survey Flow Windows Console
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'go.mod'
      - '.gitignore'
      - '.github/workflows/windows-console-build.yml'
      - 'README.md'
      - 'SETUP.txt'
      - 'QA_REPORT.md'
      - 'QUESTION_TYPES.md'
permissions:
  contents: read
jobs:
  browser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Concurrent state race checks
        run: go test -race -tags nowebview2 ./src -run 'TestConcurrentReentryIDsAreUnique|TestLeftSurveyUsesItsOwnOrigin|TestConcurrentReportWritesKeepValidJSON' -count=1
      - name: Prepare browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Synthetic browser fixtures
        run: |
          python tests/browser-fixtures.py
          python tests/information-page-browser.py
          python tests/answer-variety-browser.py
          python tests/seeded-qa-browser.py
          python tests/recovery-repro.py
          python tests/multi-page-journey.py
          python tests/validation-memory-browser.py
          python tests/carousel-auto-browser.py
          python tests/nps-browser.py
          python tests/performance-browser.py
          python tests/grid-batch-browser.py
          python tests/multi-rh-browser.py
          python tests/emo-variation-browser.py
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-memory-browser-evidence
          path: test-evidence/*.png
          if-no-files-found: ignore
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript engine regressions
        run: node tests/engine-regression.cjs
      - name: Focused JavaScript regressions
        shell: pwsh
        run: |
          node tests/instruction-focused.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/instruction-integration.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/styled-choice.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/grid-variation.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/answer-variety.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/seeded-qa.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/navigation-instruction.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/render-readiness.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Go regressions
        run: go test ./src -count=1
      - name: Synthetic log write timing
        run: go test ./src -run '^TestSyntheticLogWriteTiming$' -count=1 -v
      - name: Full runner synthetic browser end-to-end
        shell: pwsh
        run: |
          $env:SURVEY_QA_E2E = '1'
          go test ./src -run '^(TestCloudBrowserRecoveryEndToEnd|TestTwoParallelBrowsersAreIsolated|TestAutoMeasuredWorkersOverlap|TestParallelStopDrainsActiveBrowsers|TestSyntheticWorkerThroughput|TestSeededQAScreenoutIsTerminal)$' -count=1 -timeout 5m -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Concurrent browser race check
        shell: pwsh
        run: |
          $env:SURVEY_QA_E2E = '1'
          go test -race ./src -run '^(TestTwoParallelBrowsersAreIsolated|TestAutoMeasuredWorkersOverlap|TestParallelStopDrainsActiveBrowsers)$' -count=3 -timeout 5m -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build console executable (not GUI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          go build -trimpath -ldflags '-s -w' -o release/SurveyFlow.exe ./src
          if ($LASTEXITCODE -ne 0) { throw 'Windows console build failed' }
          ./scripts/embed-icon.ps1 -Executable release/SurveyFlow.exe
          $before = (Get-FileHash release/SurveyFlow.exe -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Force release/config | Out-Null
          $synthetic = '{"studyUrl":"https://survey.example.test/one","rules":[{"contains":"local synthetic rule"}],"globalRules":[{"contains":"This synthetic verification prompt is deliberately longer than forty characters.","kind":"multi_exact","strict":true,"answers":["Alpha"],"never":["Beta"]}]}'
          Set-Content -Path release/config/study-key.json -Value $synthetic -Encoding utf8
          $matching = & ./release/SurveyFlow.exe --verify-study-config 'https://survey.example.test/one'
          if ($LASTEXITCODE -ne 0 -or $matching -notmatch 'Loaded study checks: 2') { throw 'Private matching study rules failed' }
          $other = & ./release/SurveyFlow.exe --verify-study-config 'https://survey.example.test/other'
          if ($LASTEXITCODE -ne 0 -or $other -notmatch 'Loaded study checks: 1') { throw 'Private study scoping failed' }
          Remove-Item release/config/study-key.json
          Remove-Item release/config -Force
          $output = @('invalid', '') | & ./release/SurveyFlow.exe
          if ($LASTEXITCODE -ne 0) { throw 'Executable launch failed' }
          $text = $output -join "`n"
          if ($text -notmatch 'SURVEY FLOW' -or $text -notmatch 'Invalid link') { throw 'Unexpected executable smoke output' }
          if ($text -match 'grid-relation|Build version|compiler') { throw 'Technical build information visible' }
          Write-Host 'PASS executable console launch and clean setup output'
          $after = (Get-FileHash release/SurveyFlow.exe -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Executable changed after verification' }
          Write-Host "PASS exact final EXE SHA256 $after and synthetic private config scoping"
          Copy-Item -Recurse config release/config
          Copy-Item README.md, SETUP.txt, QUESTION_TYPES.md, QA_REPORT.md release/
          Compress-Archive -Path release/* -DestinationPath SurveyFlow-Recovery-Console.zip -Force
      - name: Verify Windows QA recovery package
        shell: pwsh
        run: |
          if (-not (Test-Path release/SurveyFlow.exe)) { throw 'Missing SurveyFlow.exe' }
          foreach ($file in @('README.md', 'SETUP.txt', 'QUESTION_TYPES.md', 'QA_REPORT.md')) {
            if (-not (Test-Path (Join-Path release $file))) { throw "Missing release document: $file" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path SurveyFlow-Recovery-Console.zip).Path)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if (-not ($entries -contains 'SurveyFlow.exe')) { throw 'Recovery archive lacks SurveyFlow.exe' }
            if ($entries -contains 'SurveyAutopilot.exe') { throw 'Recovery archive contains obsolete executable name' }
          } finally { $archive.Dispose() }
          Write-Host 'PASS archive includes renamed Windows executable and QA documentation'
      - uses: actions/upload-artifact@v4
        with:
          name: SurveyFlow-Recovery-Console
          path: SurveyFlow-Recovery-Console.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SurveyFlow-Verified-EXE
          path: release/SurveyFlow.exe
          if-no-files-found: error
