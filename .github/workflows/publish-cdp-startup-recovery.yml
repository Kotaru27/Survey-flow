name: Publish QA CDP startup recovery download

on:
  push:
    branches:
      - codex/qa-cdp-startup-recovery-20261111
    paths:
      - .github/workflows/publish-cdp-startup-recovery.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact passed source and download Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=43006340675
          expected_commit=989f3521fcb07cda7f4a72654bb91b18e0a28339
          test "$(gh run view "$run" -R Kotaru27/Survey-flow --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$run" -R Kotaru27/Survey-flow --json headSha --jq .headSha)" = "$expected_commit"
          mkdir -p /tmp/verified-exe /tmp/verified-portable
          gh run download "$run" -R Kotaru27/Survey-flow -n SurveyFlow-Verified-EXE -D /tmp/verified-exe
          gh run download "$run" -R Kotaru27/Survey-flow -n SurveyFlow-Recovery-Console -D /tmp/verified-portable
          test -s /tmp/verified-exe/SurveyFlow.exe
          test -s /tmp/verified-portable/SurveyFlow-Recovery-Console.zip
          unzip -t /tmp/verified-portable/SurveyFlow-Recovery-Console.zip
          expected=76d93913a6d88e780e492ac3b13cfabad26e5bf4d2a188d6396e6c80bea542b6
          direct="$(sha256sum /tmp/verified-exe/SurveyFlow.exe | cut -d' ' -f1)"
          packed="$(unzip -p /tmp/verified-portable/SurveyFlow-Recovery-Console.zip SurveyFlow.exe | sha256sum | cut -d' ' -f1)"
          test "$direct" = "$expected"
          test "$packed" = "$expected"
          cp /tmp/verified-portable/SurveyFlow-Recovery-Console.zip SurveyFlow-CDP-Recovery-20261111.zip
          sha256sum SurveyFlow-CDP-Recovery-20261111.zip > SHA256SUMS.txt
          echo "Verified EXE SHA256: $direct"
          cat SHA256SUMS.txt
      - name: Publish long-lived GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v2026.11.11-cdp-startup-recovery
          gh release create "$tag" SurveyFlow-CDP-Recovery-20261111.zip SHA256SUMS.txt \
             -R Kotaru27/Survey-flow \
             --target 989f3521fcb07cda7f4a72654bb91b18e0a28339 \
             --title "Survey Flow - Chrome startup navigation recovery" \
             --notes "Built from passing Windows Actions run 43006340675. When Chrome's initial navigation acknowledgement times out, this build reconnects to the original tab, verifies its URL, and retries a blank startup once. No survey answer logic was changed. The included EXE SHA256 is 76d93913a6d88e780e492ac3b13cfabad26e5bf4d2a188d6396e6c80bea542b6. Synthetic Go, browser, and Windows build tests passed. Use only authorized QA test surveys." \
             --latest
          gh release view "$tag" -R Kotaru27/Survey-flow --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
          gh release view "$tag" -R Kotaru27/Survey-flow --json assets --jq '.assets[].name' | grep -x SurveyFlow-CDP-Recovery-20261111.zip
      - name: Update independent raw file mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 --branch surveyflow-downloads https://github.com/Kotaru27/Survey-flow.git /tmp/sf-mirror
          cd /tmp/sf-mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/SurveyFlow-CDP-Recovery-20261111.zip" SurveyFlow-CDP-Recovery-20261111.zip
          cp "$GITHUB_WORKSPACE/SurveyFlow-CDP-Recovery-20261111.zip" SurveyFlow-Windows-Portable.zip
          sha256sum SurveyFlow-CDP-Recovery-20261111.zip SurveyFlow-Windows-Portable.zip > SHA256SUMS.txt
          cat > README.md <<'EOF'
          # Survey Flow portable Windows download
          Current verified Windows build: CDP startup recovery, 2026-11-11.
          Source commit: 989f3521fcb07cda7f4a72654bb91b18e0a28339
          Verified Windows Actions run: 43006340675
          EXE SHA256: 76d93913a6d88e780e492ac3b13cfabad26e5bf4d2a188d6396e6c80bea542b6
          Extract ZIP and run SurveyFlow.exe for authorized QA testing.
          EOF
          git add SurveyFlow-CDP-Recovery-20261111.zip SurveyFlow-Windows-Portable.zip SHA256SUMS.txt README.md
          git commit -m "Update public download to verified CDP startup recovery build"
          git push origin HEAD:refs/heads/surveyflow-downloads
          echo "Raw file: https://raw.githubusercontent.com/Kotaru27/Survey-flow/surveyflow-downloads/SurveyFlow-CDP-Recovery-20261111.zip"
